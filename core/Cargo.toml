[package]
name = "schemasync_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pg_query = "6.2.0"
# extension-module is enabled only by maturin (see pyproject.toml), so that
# `cargo test` can link against the Python interpreter normally.
pyo3 = { version = "0.29.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
