name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --manifest-path core/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build and install the core extension
        run: pip install ./core
      - name: Diff smoke test
        run: |
          python -c "
          import json, schemasync_core as s
          changes = json.loads(s.diff_json(
              s.parse_schema_json('create table t(a int);'),
              s.parse_schema_json('create table t(a int, b text not null);')))
          assert changes[0]['kind'] == 'AddColumn', changes
          print('ok:', changes)
          "

  go:
    runs-on: ubuntu-latest
    services:
      dryrun-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pip install ./core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: migrator/go.sum
      - name: Round-trip and generator tests
        working-directory: migrator
        env:
          DRYRUN_DB_URL: postgresql://postgres:dev@localhost:5433/postgres
          PYTHON: python
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gateway typecheck
        working-directory: gateway
        run: npm ci && npx tsc --noEmit
      - name: Web typecheck and build
        working-directory: web
        run: npm ci && npx tsc --noEmit -p tsconfig.app.json && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: infra
        run: docker compose config -q
