[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "schemasync-core"
version = "0.1.0"
requires-python = ">=3.10"

[tool.maturin]
module-name = "schemasync_core"
# extension-module only for the Python wheel; cargo test links the interpreter.
features = ["pyo3/extension-module"]
